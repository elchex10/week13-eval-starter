name: evals

on:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start mock LLM
        run: |
          python mock_llm/server.py > mock-llm.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/health > /dev/null; then
              echo "Mock LLM is healthy."
              exit 0
            fi
            sleep 1
          done
          cat mock-llm.log
          exit 1

      - name: Run tests
        run: pytest

      - name: Run lint
        run: flake8 app evals tests mock_llm --max-line-length 100

      - name: Run eval regression gate
        run: python evals/run_evals.py --prompt-version v2 --baseline baseline-v1.json
